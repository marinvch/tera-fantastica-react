<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100" width="240" height="100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b4513;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4a574;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background circle with gradient -->
  <circle cx="50" cy="50" r="42" fill="url(#grad1)" stroke="#3d2817" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Inner circle -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#f7f4ed" stroke-width="1.5"/>
  
  <!-- Planet (representing "Tera") -->
  <circle cx="50" cy="42" r="18" fill="#d4a574" stroke="#3d2817" stroke-width="1.5"/>
  
  <!-- Planet rings -->
  <ellipse cx="50" cy="42" rx="24" ry="8" fill="none" stroke="#3d2817" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Stars around planet -->
  <circle cx="28" cy="30" r="2" fill="#f7f4ed"/>
  <circle cx="72" cy="28" r="2" fill="#f7f4ed"/>
  <circle cx="25" cy="55" r="1.5" fill="#f7f4ed"/>
  <circle cx="75" cy="58" r="1.5" fill="#f7f4ed"/>
  <circle cx="35" cy="68" r="2" fill="#f7f4ed"/>
  <circle cx="65" cy="70" r="2" fill="#f7f4ed"/>
  
  <!-- Grid lines (sci-fi element) -->
  <line x1="15" y1="50" x2="35" y2="50" stroke="#f7f4ed" stroke-width="0.8" opacity="0.5"/>
  <line x1="65" y1="50" x2="85" y2="50" stroke="#f7f4ed" stroke-width="0.8" opacity="0.5"/>
  
  <!-- Main text: TERA FANTASTICA -->
  <text x="120" y="35" font-family="'Roboto Slab', serif" font-size="20" font-weight="bold" fill="#171512" letter-spacing="2">
    TERA
  </text>
  <text x="120" y="60" font-family="'Roboto Slab', serif" font-size="16" font-weight="600" fill="#8b7355" letter-spacing="1.5">
    FANTASTICA
  </text>
  
  <!-- Subtitle -->
  <text x="120" y="78" font-family="'Roboto', sans-serif" font-size="10" fill="#999" letter-spacing="0.5">
    Archive
  </text>
  
  <!-- Decorative underline -->
  <line x1="120" y1="85" x2="230" y2="85" stroke="#d4a574" stroke-width="1.5" opacity="0.6"/>
</svg>